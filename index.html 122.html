<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#2a0f2e">
<title>Maria Vitória, esse jogo é pra você 💖</title>
<style>
:root{--bg:#2a0f2e;--bg2:#4a1747;--rose:#ff5c8a;--gold:#ffd37a;--ink:#fbeeff;--soft:#d3b3de}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overflow:hidden}
body{background:radial-gradient(120% 80% at 50% 0%,var(--bg2),var(--bg))}
.screen{position:fixed;inset:0;display:none;flex-direction:column;padding:calc(20px + env(safe-area-inset-top,0px)) 20px calc(20px + env(safe-area-inset-bottom,0px));overflow-y:auto}
.screen.on{display:flex}
h1,h2{font-family:Georgia,"Times New Roman",serif;margin:0 0 10px;line-height:1.15}
h1{font-size:2.2rem}h2{font-size:1.5rem}
p{color:var(--soft);line-height:1.5;margin:0 0 14px}
.center{margin:auto 0;text-align:center}
.big{font-size:4.5rem;display:block;margin-bottom:8px;animation:beat 1.2s infinite}
@keyframes beat{50%{transform:scale(1.15)}}
button{font:inherit;border:0;border-radius:999px;padding:15px 28px;background:var(--rose);color:#2a0f2e;font-weight:700;font-size:1.05rem;cursor:pointer}
button:active{transform:scale(.96)}
.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--soft)}
.bar{height:10px;background:#ffffff22;border-radius:9px;overflow:hidden;margin:4px 0 8px}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--rose),var(--gold));transition:width .3s}
.cap{color:var(--gold);font-weight:700;margin-bottom:6px}
.msg{min-height:1.6em;color:var(--gold);font-weight:600;margin:2px 0 8px}
#gBody{flex:1;display:flex;flex-direction:column}
#arena{position:relative;flex:1;min-height:300px;overflow:hidden;border-radius:20px;background:#ffffff0d;touch-action:manipulation}
.h{position:absolute;top:-60px;line-height:1;cursor:pointer;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(calc(100vh + 80px))}}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.grid.g2{grid-template-columns:repeat(2,1fr);gap:12px}
.mc{aspect-ratio:1/1;border-radius:14px;background:#ffffff14;border:1.5px dashed #ffffff44;font-size:2rem;display:flex;align-items:center;justify-content:center;cursor:pointer}
.mc.up{background:#ff5c8a33;border:1.5px solid var(--rose)}
.mc.done{background:#3ddc9733;border:1.5px solid #3ddc97}
.pad{font-size:3.4rem;aspect-ratio:auto;min-height:120px;border:1.5px solid #ffffff44}
.pad.lit{background:var(--gold);transform:scale(.94)}
.slots{font-size:1.7rem;letter-spacing:.08em;text-align:center;margin:14px 0 20px;color:var(--gold);word-break:break-word}
.lets{display:flex;flex-wrap:wrap;gap:10px;justify-content:center}
.lets button{width:52px;height:52px;padding:0;border-radius:14px;background:#ffffff14;color:var(--ink);font-size:1.2rem}
.lets button.no,.opts button.no{background:#ff5c8a77;animation:shake .35s}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.q{color:var(--ink);font-size:1.15rem;margin-bottom:10px}
.opts{display:grid;gap:10px}
.opts button{background:#ffffff14;color:var(--ink);text-align:left;border-radius:16px;font-weight:600}
.opts button.ok{background:#3ddc97;color:#102a1d}
.letter{background:#fbeeff;color:#3a1238;border-radius:18px;padding:22px;font-family:Georgia,serif;line-height:1.6;font-size:1.05rem;white-space:pre-wrap;margin-bottom:16px}
#fim{background:linear-gradient(160deg,#ffc9dc,#ff8fb8);color:#4a0f2b}
#fim h2{color:#5a0f33}
#fim p{color:#6b1d42}
#fim b{color:#c2185b}
#fim .ghost{color:#5a0f33;border-color:#5a0f33}
#fim .letter{background:#fff5f9;color:#4a0f2b;box-shadow:0 6px 20px #c2185b33}
.mc img{width:100%;height:100%;object-fit:cover;object-position:center 30%;border-radius:12px}
.ph{display:block;max-width:100%;max-height:30vh;margin:0 auto 10px;object-fit:contain;border-radius:14px}
.ph.big{max-height:62vh}
.g5 .mc{font-size:1.5rem}
.fly{position:fixed;bottom:-40px;pointer-events:none;animation:up linear forwards;z-index:9}
@keyframes up{to{transform:translateY(-110vh) rotate(25deg)}}
@media (prefers-reduced-motion:reduce){.big{animation:none}}

#intro,#cine{background:#000}
.ln{font-family:Georgia,serif;font-size:1.6rem;line-height:1.35;color:#fff;margin:0 0 14px;animation:fi 1.4s both}
@keyframes fi{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.rv{opacity:0;animation:fi 1s forwards}
.tap{color:#d3b3de;animation:beat 1.6s infinite;font-size:1.1rem}
#story{background:#07020a}
#sP{display:block;max-width:100%;max-height:48vh;margin:0 auto 18px;border-radius:16px;object-fit:contain;opacity:0;transition:opacity 1.2s}
#story .ln{color:#ffe6f0}
input{font:inherit;user-select:text;-webkit-user-select:text;width:100%;padding:14px 16px;border-radius:14px;border:1.5px solid var(--soft);background:#ffffff14;color:var(--ink);margin-bottom:12px}
.wide .mc{aspect-ratio:4/3}
#mus{position:fixed;top:calc(10px + env(safe-area-inset-top,0px));right:12px;z-index:20;width:42px;height:42px;padding:0;border-radius:50%;background:#ffffff22;color:#fff;display:none}
.voph{display:flex;gap:8px;justify-content:center;margin-bottom:14px}
.voph img{max-width:48%;max-height:30vh;border-radius:12px;object-fit:cover}
.letter p{color:inherit;margin:0 0 14px;white-space:pre-line}
.cup{border:2px dashed var(--gold);border-radius:18px;padding:20px;margin:16px 0;color:var(--gold);font-family:Georgia,serif;font-size:1.2rem}
</style>
</head>
<body>

<audio id="bgm" src="2much.mp3" loop preload="auto"></audio>
<button id="mus" aria-label="música">🔊</button>

<section class="screen on" id="intro" onclick="startCine()">
  <div class="center"><div class="tap">toque para começar 💖</div></div>
</section>

<section class="screen" id="cine">
  <div class="center"><div id="cL" style="min-height:9em"></div><button id="cB" class="rv" style="display:none" onclick="chapter(1)">❤️ COMEÇAR</button></div>
</section>

<section class="screen" id="vo">
  <div class="center">
    <div class="cap">💌 Uma mensagem pra você</div>
    <div class="voph" id="voP"></div>
    <div class="letter" id="voT"></div>
    <button id="voB" class="rv">Continuar 💖</button>
  </div>
</section>

<section class="screen" id="par">
  <div class="center"><div id="pL" style="min-height:9em"></div><button id="pB" class="rv" style="display:none" onclick="story()">DESCOBRIR</button></div>
</section>

<section class="screen" id="story">
  <div class="center"><img id="sP" alt=""><div id="sL"></div></div>
</section>

<section class="screen" id="mis">
  <div class="center">
    <span class="big">🎁</span>
    <h2>ÚLTIMA MISSÃO</h2>
    <p>Existe uma surpresa esperando por você. Para descobrir onde ela está, resolva o último enigma.</p>
    <div id="misBox">
      <p class="q" id="misQ"></p>
      <input id="misIn" placeholder="Sua resposta..." autocomplete="off">
      <div class="msg" id="misMsg"></div>
      <button onclick="misGo()">Responder</button>
    </div>
    <div id="misEnd" style="display:none"><div id="misL"></div><div id="misS"></div></div>
  </div>
</section>

<section class="screen" id="chap">
  <div class="center">
    <span class="big" id="cEmoji"></span>
    <div class="cap" id="cNum"></div>
    <h2 id="cTitle"></h2>
    <p id="cText"></p>
    <button id="cBtn">Jogar</button>
  </div>
</section>

<section class="screen" id="game">
  <h2 id="gT"></h2>
  <p id="gP"></p>
  <div class="bar"><i id="gBar"></i></div>
  <div class="msg" id="gMsg"></div>
  <div id="gBody"></div>
</section>

<section class="screen" id="fim">
  <h2>Maria Vitória, com todo o meu amor</h2>
  <div class="letter" id="carta"></div>
  <div style="text-align:center"><button onclick="mission()">Última missão 🎁</button></div>
</section>

/* ====== FIM DA PERSONALIZAÇÃO ====== */

const $=id=>document.getElementById(id),R=a=>a[Math.floor(Math.random()*a.length)],bar=p=>$('gBar').style.width=p+'%';
let tm;
function show(id){clearInterval(tm);document.querySelectorAll('.screen').forEach(s=>s.classList.remove('on'));$(id).classList.add('on')}
function chapter(n){
  const c=CFG.caps[n-1];
  $('cEmoji').textContent=c.e;$('cNum').textContent='Capítulo '+n+' de '+CFG.caps.length;
  $('cTitle').textContent=c.t;$('cText').textContent=c.x;$('cBtn').textContent='Jogar';
  $('cBtn').onclick=()=>play(n);show('chap');
}
function play(n){
  const c=CFG.caps[n-1];
  $('gT').textContent=c.t;$('gP').textContent=c.h;$('gBody').innerHTML='';$('gMsg').textContent='';bar(0);
  show('game');GM[c.g](n);
}
function done(n){
  if(n===CFG.caps.length){show('fim');$('carta').textContent=CFG.carta+'\n\n— '+CFG.de;confetti();return}
  const c=CFG.caps[n-1];
  $('cEmoji').textContent='✨';$('cNum').textContent='Fase '+n+' completa!';
  $('cTitle').textContent=c.fim;$('cText').textContent='';$('cBtn').textContent='Próximo capítulo';
  $('cBtn').onclick=()=>chapter(n+1);show('chap');
}

/* Fase 1: corações (com corações partidos) */
function g1(n){
  const a=document.createElement('div');a.id='arena';$('gBody').appendChild(a);
  let pts=0,ok=false;const M=25;$('gMsg').textContent='💗 0 / '+M;
  function sp(){
    const h=document.createElement('div'),r=Math.random(),k=r<.2?'b':r<.32?'g':'n';
    h.className='h';h.textContent=k=='b'?'💔':k=='g'?'💛':R(['💖','💗','💕','💘']);
    h.style.fontSize=(30+Math.random()*24)+'px';
    h.style.left=Math.random()*Math.max(10,a.clientWidth-60)+'px';
    h.style.animationDuration=(2.4+Math.random()*2)+'s';
    h.onclick=()=>{
      pts=Math.max(0,pts+(k=='b'?-3:k=='g'?3:1));h.remove();
      $('gMsg').textContent='💗 '+Math.min(pts,M)+' / '+M;bar(Math.min(100,pts/M*100));
      if(pts>=M&&!ok){ok=true;clearInterval(tm);setTimeout(()=>done(n),400)}
    };
    h.addEventListener('animationend',()=>h.remove());a.appendChild(h);
  }
  tm=setInterval(sp,480);sp();
}

/* Fase 2: memória com limite de jogadas */
function g2(n){
  const P=CFG.pares,L=24;let first=null,lock=false,f=0,mv=0;
  const g=document.createElement('div');g.className='grid';$('gBody').appendChild(g);
  $('gMsg').textContent='Jogadas: 0 / '+L;
  [...P,...P].map(p=>({e:p[0],n:p[1]})).sort(()=>Math.random()-.5).forEach(d=>{
    const c=document.createElement('div');c.className='mc';c.textContent='❓';
    c.onclick=()=>{
      if(lock||c.classList.contains('up')||c.classList.contains('done'))return;
      c.classList.add('up');face(c,d.e);
      if(!first){first={c,d};return}
      mv++;
      if(first.d.e===d.e){
        c.className=first.c.className='mc done';f++;bar(f/P.length*100);
        $('gMsg').textContent=d.n+' 💕  ('+mv+'/'+L+')';first=null;
        if(f===P.length)setTimeout(()=>done(n),800);
      }else{
        lock=true;const x=first;first=null;$('gMsg').textContent='Jogadas: '+mv+' / '+L;
        setTimeout(()=>{
          c.className='mc';c.textContent='❓';x.c.className='mc';x.c.textContent='❓';lock=false;
          if(mv>=L){$('gMsg').textContent='Acabaram as jogadas! Vamos de novo 😘';lock=true;setTimeout(()=>play(n),1300)}
        },750);
      }
    };
    g.appendChild(c);
  });
}

/* Fase 3: sequência (estilo Simon) */
function g3(n){
  const E=['💖','💛','💙','💚'],N=6;let seq=[],pos=0,busy=true;
  const g=document.createElement('div');g.className='grid g2';$('gBody').appendChild(g);
  const pads=E.map((e,i)=>{
    const p=document.createElement('div');p.className='mc pad';p.textContent=e;
    p.onclick=()=>{
      if(busy)return;flash(i);
      if(i!=seq[pos]){$('gMsg').textContent='Ops, errou! Vamos de novo 😘';seq=[];pos=0;busy=true;setTimeout(round,1300);return}
      pos++;
      if(pos==seq.length){busy=true;if(seq.length==N){bar(100);setTimeout(()=>done(n),600)}else setTimeout(round,800)}
    };
    g.appendChild(p);return p;
  });
  function flash(i){pads[i].classList.add('lit');setTimeout(()=>pads[i].classList.remove('lit'),300)}
  function round(){
    seq.push(Math.floor(Math.random()*4));pos=0;busy=true;bar((seq.length-1)/N*100);
    $('gMsg').textContent='Observe... ('+seq.length+'/'+N+')';
    seq.forEach((s,k)=>setTimeout(()=>flash(s),700+k*600));
    setTimeout(()=>{busy=false;$('gMsg').textContent='Sua vez!'},700+seq.length*600);
  }
  setTimeout(round,600);
}

/* Fase 4: palavras embaralhadas */
function g4(n){
  const W=CFG.palavras;let w=0;
  function load(){
    const word=W[w][0],em=W[w][1];let i=0;const b=$('gBody');b.innerHTML='';
    $('gMsg').textContent='Dica: '+W[w][2]+' ('+(w+1)+'/'+W.length+')';
    const s=document.createElement('div');s.className='slots';
    const upd=()=>s.textContent=em+'  '+[...word].map((c,k)=>k<i?c:'_').join(' ');upd();b.appendChild(s);
    const l=document.createElement('div');l.className='lets';
    [...word].sort(()=>Math.random()-.5).forEach(ch=>{
      const x=document.createElement('button');x.textContent=ch;
      x.onclick=()=>{
        if(ch===word[i]){
          x.disabled=true;x.style.opacity=.3;i++;upd();
          if(i==word.length){w++;bar(w/W.length*100);if(w==W.length)setTimeout(()=>done(n),600);else setTimeout(load,800)}
        }else{x.classList.add('no');setTimeout(()=>x.classList.remove('no'),350)}
      };
      l.appendChild(x);
    });
    b.appendChild(l);
  }
  load();
}

/* Fase 5: Battle Royale do Amor (estilo Free Fire) */
function g5(n){
  const b=$('gBody'),cv=document.createElement('canvas');
  cv.style.cssText='flex:1;width:100%;min-height:340px;border-radius:20px;background:#ffffff0d;touch-action:none;display:block';
  b.appendChild(cv);const W=cv.clientWidth,H=cv.clientHeight||340;cv.width=W;cv.height=H;
  const x=cv.getContext('2d'),G=12,zr0=Math.hypot(W,H)/2,cx=W/2,cy=H/2;
  let px=cx,py=cy,hp=5,kills=0,spawned=0,T=0,sp=0,fire=0,inv=0,zt=0,over=false,down=false,sx=0,sy=0,jx=0,jy=0,last=0,ens=[],bl=[],zr=zr0;
  const hud=()=>$('gMsg').textContent='❤️'.repeat(Math.max(hp,0))+'   Restam: '+(G-kills+1)+' jogadores';
  const hit=()=>{if(inv>0||over)return;hp--;inv=1;hud();if(hp<=0){over=true;$('gMsg').textContent='Seu coração foi partido! Tente de novo 😘';setTimeout(()=>play(n),1400)}};
  const pt=e=>{const r=cv.getBoundingClientRect();return[e.clientX-r.left,e.clientY-r.top]};
  cv.onpointerdown=e=>{down=true;[sx,sy]=pt(e);jx=jy=0;cv.setPointerCapture(e.pointerId)};
  cv.onpointermove=e=>{if(!down)return;const[a,c]=pt(e);jx=a-sx;jy=c-sy;const d=Math.hypot(jx,jy);if(d>60){sx+=jx/d*(d-60);sy+=jy/d*(d-60);jx=a-sx;jy=c-sy}};
  cv.onpointerup=cv.onpointercancel=()=>{down=false;jx=jy=0};
  function loop(t){
    if(over)return;
    const dt=Math.min(.05,(t-last)/1000);last=t;T+=dt;inv-=dt;
    zr=Math.max(100,zr0*(1-T/50));
    const d=Math.hypot(jx,jy);
    if(down&&d>4){const k=Math.min(1,d/60)*170*dt;px+=jx/d*k;py+=jy/d*k}
    px=Math.max(16,Math.min(W-16,px));py=Math.max(16,Math.min(H-16,py));
    if(Math.hypot(px-cx,py-cy)>zr){zt+=dt;if(zt>1){zt=0;hit()}}else zt=0;
    sp+=dt;
    if(sp>1.1&&ens.length<6&&spawned<G){
      sp=0;spawned++;const s=Math.floor(Math.random()*4);
      ens.push({x:s<2?(s?W:0):Math.random()*W,y:s>=2?(s==2?0:H):Math.random()*H,hp:2,e:R(['💔','😤','😢'])});
    }
    fire-=dt;let nr=null,nd=230;
    ens.forEach(e=>{const q=Math.hypot(e.x-px,e.y-py);if(q<nd){nd=q;nr=e}});
    if(fire<=0&&nr){fire=.45;bl.push({x:px,y:py,vx:(nr.x-px)/nd*380,vy:(nr.y-py)/nd*380,l:1.2})}
    bl.forEach(o=>{o.x+=o.vx*dt;o.y+=o.vy*dt;o.l-=dt});
    ens.forEach(e=>{
      const q=Math.hypot(px-e.x,py-e.y)||1,v=(45+T*.6)*dt;
      e.x+=(px-e.x)/q*v;e.y+=(py-e.y)/q*v;
      if(q<22&&inv<=0){hit();e.x-=(px-e.x)/q*50;e.y-=(py-e.y)/q*50}
    });
    bl.forEach(o=>ens.forEach(e=>{if(o.l>0&&Math.hypot(o.x-e.x,o.y-e.y)<20){o.l=0;e.hp--}}));
    const dead=ens.filter(e=>e.hp<=0).length;
    if(dead){kills+=dead;ens=ens.filter(e=>e.hp>0);bar(kills/G*100);hud()}
    bl=bl.filter(o=>o.l>0);
    if(kills>=G&&!over){over=true;$('gMsg').textContent='BOOYAH DE AMOR! 🏆';setTimeout(()=>done(n),1500)}
    x.clearRect(0,0,W,H);
    x.fillStyle='rgba(255,60,120,.25)';x.beginPath();x.rect(0,0,W,H);x.arc(cx,cy,zr,0,7);x.fill('evenodd');
    x.strokeStyle='#ffd37a';x.lineWidth=2;x.beginPath();x.arc(cx,cy,zr,0,7);x.stroke();
    x.textAlign='center';x.textBaseline='middle';
    ens.forEach(e=>{x.font='26px serif';x.fillText(e.e,e.x,e.y)});
    bl.forEach(o=>{x.font='15px serif';x.fillText('💘',o.x,o.y)});
    x.globalAlpha=inv>0&&Math.floor(T*10)%2?.4:1;x.font='30px serif';x.fillText('😍',px,py);x.globalAlpha=1;
    if(down){x.strokeStyle='#ffffff88';x.beginPath();x.arc(sx,sy,60,0,7);x.stroke();x.fillStyle='#ffffff55';x.beginPath();x.arc(sx+jx,sy+jy,22,0,7);x.fill()}
    requestAnimationFrame(loop);
  }
  hud();requestAnimationFrame(t=>{last=t;loop(t)});
}

/* Fase 6: quiz com 3 vidas */
function g6(n){
  const Q=CFG.quiz;let qi=0,lv=3;
  function sq(){
    const q=Q[qi],b=$('gBody');bar(qi/Q.length*100);
    b.innerHTML='<p class="q"></p><div class="opts"></div>';b.firstChild.textContent=q.q;
    $('gMsg').textContent='Vidas: '+'❤️'.repeat(lv);
    q.o.forEach((t,i)=>{
      const x=document.createElement('button');x.textContent=t;
      x.onclick=()=>{
        if(q.c<0||i==q.c){
          x.className='ok';b.querySelectorAll('button').forEach(y=>y.disabled=true);
          $('gMsg').textContent=q.c<0?'Resposta perfeita! 😍':'Acertou! 🥰';
          setTimeout(()=>{qi++;qi<Q.length?sq():done(n)},900);
        }else{
          lv--;x.classList.add('no');x.disabled=true;
          if(lv<=0){b.querySelectorAll('button').forEach(y=>y.disabled=true);$('gMsg').textContent='Acabaram as vidas! Começando de novo 😘';setTimeout(()=>play(n),1300)}
          else $('gMsg').textContent='Quase! Vidas: '+'❤️'.repeat(lv);
        }
      };
      b.lastChild.appendChild(x);
    });
  }
  sq();
}

function face(c,e){if(e.length>10){c.innerHTML='';const i=document.createElement('img');i.src=e;c.appendChild(i)}else c.textContent=e}
function cvs(){const c=document.createElement('canvas');c.style.cssText='flex:1;width:100%;min-height:340px;border-radius:20px;background:#ffffff0d;touch-action:none;display:block';$('gBody').appendChild(c);c.width=c.clientWidth;c.height=c.clientHeight||340;return c}
function loopRun(u){let last=0,go=true;const f=t=>{if(!go)return;const dt=Math.min(.05,(t-last)/1000);last=t;if(u(dt)===false){go=false;return}requestAnimationFrame(f)};requestAnimationFrame(t=>{last=t;f(t)})}

/* Corrida */
function gRun(n){
  const c=cvs(),x=c.getContext('2d'),W=c.width,H=c.height,gy=H-60,D=24;
  let y=gy,vy=0,T=0,hp=3,inv=0,sc=0,ob=[],sp=0;
  c.onpointerdown=()=>{if(y>=gy-1)vy=-560};
  const st=()=>$('gMsg').textContent='❤️'.repeat(hp)+'   💖 '+sc;st();
  loopRun(dt=>{
    T+=dt;inv-=dt;vy+=1500*dt;y=Math.min(gy,y+vy*dt);sp+=dt;
    if(sp>1.1&&T<D-3){sp=0;ob.push(Math.random()<.6?{x:W+20,y:gy,e:R(['🪨','🚧','🐕']),h:1}:{x:W+20,y:gy-105,e:'💖',h:0})}
    ob.forEach(o=>o.x-=(220+T*6)*dt);
    ob=ob.filter(o=>{
      if(Math.abs(o.x-70)<24&&Math.abs(o.y-y)<34){if(o.h){if(inv<=0){hp--;inv=1.2;st()}return true}sc++;st();return false}
      return o.x>-30;
    });
    bar(T/D*100);
    if(hp<=0){$('gMsg').textContent='Tropeçou! De novo 😘';setTimeout(()=>play(n),1200);return false}
    if(T>=D){$('gMsg').textContent='Chegou até mim! 💞';setTimeout(()=>done(n),1200);return false}
    x.clearRect(0,0,W,H);x.strokeStyle='#ffffff55';x.beginPath();x.moveTo(0,gy+22);x.lineTo(W,gy+22);x.stroke();
    x.textAlign='center';x.textBaseline='middle';x.font='32px serif';
    ob.forEach(o=>x.fillText(o.e,o.x,o.y));
    x.globalAlpha=inv>0&&Math.floor(T*10)%2?.4:1;x.fillText('🏃‍♀️',70,y);x.globalAlpha=1;
    if(T>D-5)x.fillText('🧍‍♂️',W-40,gy);
  });
}

/* Acerte os corações */
function gTap(n){
  const a=document.createElement('div');a.id='arena';$('gBody').appendChild(a);
  let h=0,m=0,s=0,over=false;const G=15,S=26;
  const st=()=>$('gMsg').textContent='💖 '+h+' / '+G+'   Perdidos: '+m+' / 8';st();
  tm=setInterval(()=>{
    if(s>=S){clearInterval(tm);return}
    s++;const e=document.createElement('div');e.className='h';e.style.animation='none';
    e.style.top=Math.random()*Math.max(10,a.clientHeight-70)+'px';e.style.left=Math.random()*Math.max(10,a.clientWidth-60)+'px';
    e.style.fontSize='42px';e.textContent=R(['💖','💗','💘']);
    const t=setTimeout(()=>{
      if(over||!e.isConnected)return;e.remove();m++;st();
      if(m>=8){over=true;clearInterval(tm);$('gMsg').textContent='Muitos corações escaparam! De novo 😘';setTimeout(()=>play(n),1200)}
    },1300-s*20);
    e.onclick=()=>{if(over)return;clearTimeout(t);e.remove();h++;st();bar(h/G*100);if(h>=G){over=true;clearInterval(tm);setTimeout(()=>done(n),500)}};
    a.appendChild(e);
  },750);
}

/* Escape Room com fotos */
function gEsc(n){
  const b=$('gBody');let ok=0;ESC.forEach(q=>q.ok=0);
  function room(){
    b.innerHTML='';const g=document.createElement('div');g.className='grid g2';
    ESC.forEach((q,i)=>{const d=document.createElement('div');d.className='mc pad'+(q.ok?' done':'');d.textContent=q.ok?'🔑':q.i;d.onclick=()=>{if(!q.ok)ask(i)};g.appendChild(d)});
    b.appendChild(g);$('gMsg').textContent='Chaves: '+ok+' / '+ESC.length;bar(ok/ESC.length*100);
    if(ok==ESC.length){const x=document.createElement('button');x.textContent='🚪 Abrir a porta';x.style.marginTop='16px';x.onclick=()=>done(n);b.appendChild(x)}
  }
  function ask(i){
    const q=ESC[i];b.innerHTML='<img class="ph"><p class="q"></p><div class="opts"></div>';
    b.firstChild.src=FOTOS[q.f];b.firstChild.onclick=e=>e.target.classList.toggle("big");b.children[1].textContent=q.q;
    q.o.forEach((t,k)=>{
      const x=document.createElement('button');x.textContent=t;
      x.onclick=()=>{if(k==q.c){q.ok=1;ok++;room()}else{x.classList.add('no');x.disabled=true}};
      b.lastChild.appendChild(x);
    });
  }
  room();
}

/* Campo minado do amor */
function gMine(n){
  let lv=3,end=false;const t=['💍',...Array(6).fill('💔'),...Array(3).fill('💋')];
  while(t.length<25)t.push('💖');t.sort(()=>Math.random()-.5);
  const g=document.createElement('div');g.className='grid g5';g.style.gridTemplateColumns='repeat(5,1fr)';$('gBody').appendChild(g);
  const st=()=>$('gMsg').textContent='Vidas: '+'❤️'.repeat(lv);st();
  t.forEach(e=>{
    const c=document.createElement('div');c.className='mc';c.textContent='❓';
    c.onclick=()=>{
      if(c.dataset.o||end)return;c.dataset.o=1;c.textContent=e;
      if(e=='💔'){lv--;c.style.background='#ff5c8a77';st();if(lv<=0){end=true;$('gMsg').textContent='Acabaram as vidas! Tenta de novo 😘';setTimeout(()=>play(n),1300)}}
      else{c.className='mc done';if(e=='💋'){lv=Math.min(5,lv+1);st()}if(e=='💍'){end=true;$('gMsg').textContent='Você achou o prêmio especial! 💍';bar(100);setTimeout(()=>done(n),1400)}}
    };
    g.appendChild(c);
  });
}

/* Acabe com os problemas (estilo Space Invaders) */
function gInv(n){
  const c=cvs(),x=c.getContext('2d'),W=c.width,H=c.height,G=15;
  let px=W/2,lv=3,k=0,sp=0,fire=0,T=0,en=[],bl=[];
  c.onpointerdown=c.onpointermove=e=>{px=e.clientX-c.getBoundingClientRect().left};
  const st=()=>$('gMsg').textContent='❤️'.repeat(lv)+'   Destruídos: '+k+' / '+G;st();
  loopRun(dt=>{
    T+=dt;sp+=dt;fire-=dt;
    if(sp>1){sp=0;en.push({x:45+Math.random()*(W-90),y:-10,w:R(['SAUDADE','BRIGA','DISTÂNCIA','CIÚMES','SONO']),h:2,v:40+T*1.5})}
    if(fire<=0){fire=.35;bl.push({x:px,y:H-50})}
    bl.forEach(o=>o.y-=450*dt);en.forEach(e=>e.y+=e.v*dt);
    bl.forEach(o=>en.forEach(e=>{if(o.y>0&&Math.abs(o.x-e.x)<48&&Math.abs(o.y-e.y)<16){o.y=-99;e.h--}}));
    const dead=en.filter(e=>e.h<=0).length;if(dead){k+=dead;en=en.filter(e=>e.h>0);bar(k/G*100);st()}
    const low=en.filter(e=>e.y>H-40).length;if(low){lv-=low;en=en.filter(e=>e.y<=H-40);st()}
    bl=bl.filter(o=>o.y>0);
    if(lv<=0){$('gMsg').textContent='Os problemas chegaram! De novo 😘';setTimeout(()=>play(n),1200);return false}
    if(k>=G){$('gMsg').textContent='Problemas destruídos! 💪';setTimeout(()=>done(n),1200);return false}
    x.clearRect(0,0,W,H);x.textAlign='center';x.textBaseline='middle';x.font='bold 13px system-ui';
    en.forEach(e=>{const w=x.measureText(e.w).width+16;x.fillStyle=e.h>1?'#ff5c8a':'#ff9ec0';x.fillRect(e.x-w/2,e.y-12,w,24);x.fillStyle='#2a0f2e';x.fillText(e.w,e.x,e.y)});
    x.font='16px serif';bl.forEach(o=>x.fillText('💘',o.x,o.y));x.font='34px serif';x.fillText('😍',px,H-30);
  });
}
const GM={hearts:g1,memory:g2,simon:g3,words:g4,battle:g5,quiz:g6,run:gRun,tap:gTap,esc:gEsc,mine:gMine,inv:gInv};

/* Final */
function confetti(){
  for(let i=0;i<28;i++){
    const f=document.createElement('div');f.className='fly';f.textContent=['💖','💗','💕','✨'][i%4];
    f.style.left=Math.random()*95+'vw';f.style.fontSize=(18+Math.random()*22)+'px';
    f.style.animationDuration=(3+Math.random()*3)+'s';f.style.animationDelay=(Math.random()*1.5)+'s';
    document.body.appendChild(f);setTimeout(()=>f.remove(),7000);
  }
}

E eu tenho sorte de poder conhecer, aos poucos, a pessoa que essa história ajudou a formar. ❤️

Feliz 5 meses, meu amor.

const bgm=$('bgm'),mb=$('mus');let T2;
function music(){bgm.volume=.55;mb.style.display='block';bgm.play().then(()=>mb.textContent='🔊').catch(()=>mb.textContent='🔇')}
mb.onclick=e=>{e.stopPropagation();if(bgm.paused){bgm.play();mb.textContent='🔊'}else{bgm.pause();mb.textContent='🔇'}};
bgm.addEventListener('error',()=>mb.style.display='none');

function reveal(box,lines,keep,cb,gap){
  let i=0;box.innerHTML='';
  (function nx(){
    if(i>=lines.length){cb&&cb();return}
    const L=lines[i++],d=document.createElement('div');d.className='ln';d.textContent=L;
    if(!keep)box.innerHTML='';box.appendChild(d);
    T2=setTimeout(nx,gap||(1900+L.length*55));
  })();
}
function startCine(){
  $('intro').onclick=null;music();show('cine');
  reveal($('cL'),['Maria Vitória...','Você tem ideia de quantas coisas aconteceram nesses últimos 5 meses?','Hoje eu quero te fazer lembrar de algumas delas.'],false,()=>{const b=$('cB');b.style.display='';b.style.animationDelay='.6s'});
}

/* Memória: fase 1 (nossas fotos) e fase 2 (fotos do vô) */
function g2(n,ph){
  ph=ph||1;const P=ph==2?CFG.paresAvo:CFG.pares,L=ph==2?18:24;let first=null,lock=false,f=0,mv=0;
  const g=document.createElement('div');g.className=ph==2?'grid g2 wide':'grid';$('gBody').appendChild(g);
  $('gMsg').textContent='Jogadas: 0 / '+L;
  [...P,...P].map(p=>({e:p[0],n:p[1]})).sort(()=>Math.random()-.5).forEach(d=>{
    const c=document.createElement('div');c.className='mc';c.textContent='❓';
    c.onclick=()=>{
      if(lock||c.classList.contains('up')||c.classList.contains('done'))return;
      c.classList.add('up');face(c,d.e);
      if(!first){first={c,d};return}
      mv++;
      if(first.d.e===d.e){
        c.className=first.c.className='mc done';f++;bar(f/P.length*100);
        $('gMsg').textContent=d.n+' 💕  ('+mv+'/'+L+')';first=null;
        if(f===P.length)setTimeout(()=>ph==2?vo(n):memBonus(n),ph==2?1200:800);
      }else{
        lock=true;const x=first;first=null;$('gMsg').textContent='Jogadas: '+mv+' / '+L;
        setTimeout(()=>{
          c.className='mc';c.textContent='❓';x.c.className='mc';x.c.textContent='❓';lock=false;
          if(mv>=L){$('gMsg').textContent='Acabaram as jogadas! Vamos de novo 😘';lock=true;setTimeout(()=>ph==2?memP2(n):play(n),1300)}
        },750);
      }
    };
    g.appendChild(c);
  });
}
GM.memory=g2;

function vo(n){
  $('voP').innerHTML='';VOF.slice().reverse().forEach(s=>{const i=document.createElement('img');i.src=s;$('voP').appendChild(i)});
  const t=$('voT');t.innerHTML='';const ps=CFG.vo.split('\n\n');
  ps.forEach((x,i)=>{const p=document.createElement('p');p.textContent=x;p.className='rv';p.style.animationDelay=(i*2.2)+'s';t.appendChild(p)});
  const b=$('voB');b.style.animationDelay=(ps.length*2.2+.5)+'s';b.onclick=()=>done(n);
  show('vo');$('vo').scrollTop=0;
}

function done(n){
  if(n===CFG.caps.length){parabens();return}
  const c=CFG.caps[n-1];
  $('cEmoji').textContent='✨';$('cNum').textContent='Fase '+n+' completa!';
  $('cTitle').textContent=c.fim;$('cText').textContent='';$('cBtn').textContent='Próximo capítulo';
  $('cBtn').onclick=()=>chapter(n+1);show('chap');
}

    if(i>=LS.length){T2=setTimeout(()=>{$('carta').textContent=CFG.carta+'\n\n— '+CFG.de;show('fim');confetti()},3500);return}
    const d=document.createElement('div');d.className='ln';d.textContent=LS[i];box.innerHTML='';box.appendChild(d);
    if(i>=2){im.style.opacity=0;setTimeout(()=>{im.src=FOTOS[(i-3)%FOTOS.length];im.onload=()=>im.style.opacity=1},500)}
    i++;T2=setTimeout(nx,i<=2?3200:4200);
  })();
}
function mission(){show('mis');$('misQ').textContent=CFG.mis.p;$('misIn').value='';$('misMsg').textContent=''}
const norm=s=>s.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f\s]/g,'');
function misGo(){
  const v=norm($('misIn').value);
  if(CFG.mis.r.some(r=>norm(r)===v)){
    $('misBox').style.display='none';$('misEnd').style.display='';
    const L=['Você acertou. ❤️'];if(CFG.mis.local)L.push(CFG.mis.local);L.push('Agora feche esse jogo.','E venha me encontrar. ❤️');
    reveal($('misL'),L,true,()=>{
      T2=setTimeout(()=>{
        const b=document.createElement('button');b.className='ghost rv';b.style.marginTop='30px';b.textContent='Você realmente achou que tinha acabado? 👀';
        b.onclick=()=>{const S=CFG.segredo;$('misS').innerHTML='';const c=document.createElement('div');c.className='cup rv';
          c.innerHTML='<div></div><p style="color:var(--ink);font-size:1rem;margin:10px 0"></p><small style="color:var(--soft)"></small>';
          c.children[0].textContent=S.t;c.children[1].textContent=S.x;c.children[2].textContent=S.f;$('misS').appendChild(c);confetti()};
        $('misS').appendChild(b);
      },7000);
    },2200);
  }else{const x=$('misIn');x.classList.add('no');setTimeout(()=>x.classList.remove('no'),350);$('misMsg').textContent=CFG.mis.dica}
}
</script>
